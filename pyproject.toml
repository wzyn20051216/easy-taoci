[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-taoci"
version = "1.0.0"
description = "Privacy-first Chinese graduate supervisor research and outreach draft automation skill"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Easy Taoci contributors"}]
keywords = ["codex-skill", "graduate-admission", "email-drafts", "netease-mail"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
browser = ["playwright>=1.45"]
dev = ["build>=1.2"]

[project.scripts]
easy-taoci = "easy_taoci.cli:main"

[tool.setuptools.packages.find]
include = ["easy_taoci*"]
